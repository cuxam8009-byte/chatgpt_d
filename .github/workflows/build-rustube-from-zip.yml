# Đặt file này vào repo tại: .github/workflows/build-rustube-from-zip.yml
# Rồi tải lên CÙNG repo đúng MỘT file .zip của dự án (ví dụ project.zip).
# Chạy: tab Actions > "Build Rustube (from zip)" > Run workflow. APK nằm ở mục Artifacts.
name: Build Rustube (from zip)

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1)
          test -n "$ZIP" || { echo "Không thấy file .zip nào ở thư mục gốc của repo"; exit 1; }
          echo "Dùng file: $ZIP"
          rm -rf work && mkdir work
          unzip -q "$ZIP" -d work
          GR=$(find work -maxdepth 3 -name gradlew | head -1)
          test -n "$GR" || { echo "Không thấy gradlew trong file zip"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$GR")" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" Rustube.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rustube-apk
          path: Rustube.apk
